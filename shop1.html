<!DOCTYPE html>
<html>
<head>
    <title>Shop 1</title>
    <script type="module" src="./shop1.ts"></script>
    <link rel="stylesheet" href="./shop1.css">
</head>

<body>

    <h1>Buy three items</h1>

    <table>
        <thead>
            <tr> 
                <th scope = "row">Shopping Cart</th>
            </tr>
            
        </thead>
        <tbody>
            <tr>
                <td>Apple</td>
                <td name="unit-price">00.33</td>
                <td name="quantity">6</td>
            </tr>
            <tr>
                <td>Grapes</td>
                <td name="unit-price">3.00</td>
                <td name="quantity">1</td>
            </tr>
            <tr>
                <td>Oranges</td>
                <td name="unit-price">00.40</td>
                <td name="quantity">12</td>
            </tr>
            <tfoot>
                <tr>
                    <td><button id = "calculate-total">Sum </button></td>
                    <td>Total</td>
                    <td id = "payment">--</td>
                </tr>
                     <tr>
                    <td>&nbsp;</td>
                    <td>Total with 25% Discount</td>
                    <td id = "discounted">--</td>
                </tr>
            </tfoot>
        </tbody>
    </table>
